# Static frontend locations to merge into the existing site server block.
# This is a template, not a production deployment; keep existing Java API/image/download routes.
root /srv/dayu/frontend/dist;
index index.html;

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location /flat-20260925/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

# Versioned resources are immutable. Keep this URL version aligned with package-lock.json and the HTML.
location ^~ /vendor/cesium/1.146.0/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

location = /cesium-config.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

location = /favicon.ico { try_files $uri =404; }
location ~ /\. { deny all; }

# The existing /api/, /WebP/, /media/webp/, /CPP_Colorbar/ and /colorbars/ routes remain necessary.
# Do not expose /netcdf/ as a static directory. Include standard mime.types (JS/CSS/wasm/XML types).
