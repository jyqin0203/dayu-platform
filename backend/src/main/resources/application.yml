spring:
  application:
    name: dayu-platform-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DAYU_DB_URL:jdbc:mariadb://localhost:3306/dayu}
    username: ${DAYU_DB_USER:dayu}
    password: ${DAYU_DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+00:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  servlet:
    session:
      cookie:
        name: DAYUSESSID
        http-only: true
        same-site: lax

dayu:
  indexing:
    enabled: false
    interval: 15m
  preview:
    dpi: 500
