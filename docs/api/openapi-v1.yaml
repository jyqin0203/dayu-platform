        nameZh: {type: string, minLength: 2, maxLength: 255}
        nameEn: {type: string, minLength: 2, maxLength: 255}
        unit: {type: [string, 'null'], maxLength: 64}
        descriptionZh: {type: string}
        descriptionEn: {type: string}
        producer: {type: string, minLength: 1, maxLength: 255}
        algorithmName: {type: [string, 'null'], maxLength: 255}
        sourceDescription: {type: string}
        officialSourceUrl: {type: [string, 'null'], format: uri}
        colorbarRequired: {type: boolean}
        colorbarPath: {type: [string, 'null'], maxLength: 512}
        sortOrder: {type: integer}
    UpdateProductRequest:
      type: object
      required: [nameZh, nameEn, descriptionZh, descriptionEn, producer, sourceDescription, colorbarRequired, sortOrder]
      properties:
        nameZh: {type: string, minLength: 2, maxLength: 255}
        nameEn: {type: string, minLength: 2, maxLength: 255}
        unit: {type: [string, 'null'], maxLength: 64}
        descriptionZh: {type: string}
        descriptionEn: {type: string}
        producer: {type: string}
        algorithmName: {type: [string, 'null']}
        sourceDescription: {type: string}
        officialSourceUrl: {type: [string, 'null'], format: uri}
        colorbarRequired: {type: boolean}
        colorbarPath: {type: [string, 'null']}
        sortOrder: {type: integer}
    ConfigureModeRequest:
      type: object
      required: [enabled, staleAfterMinutes]
      properties:
        enabled: {type: boolean}
        staleAfterMinutes: {type: integer, minimum: 10, maximum: 10080}

    PreviewFrame:
      type: object
      required: [webpAssetId, previewUrl, validTime, downloadAvailable]
      properties:
        webpAssetId: {type: integer, format: int64}
        previewUrl: {type: string, format: uri-reference}
