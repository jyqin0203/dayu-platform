      type: object
      required: [message, displayZone, recentMessages]
      properties:
        message: {type: string, minLength: 1, maxLength: 2000}
        displayZone: {type: string, description: IANA 时区，例如 Asia/Shanghai}
        pageContext: {oneOf: [{$ref: '#/components/schemas/CopilotPageContext'}, {type: 'null'}]}
        recentMessages: {type: array, maxItems: 6, items: {type: string, maxLength: 2000}}
    InterpretedCriteria:
      type: object
      properties:
