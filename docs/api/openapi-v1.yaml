        leadMinutes: {type: [integer, 'null'], minimum: 0}
        downloadAvailable: {type: boolean}
    ForecastCycle:
      type: object
      required: [cycleTime, firstValidTime, lastValidTime, frameCount]
      properties:
        cycleTime: {$ref: '#/components/schemas/UtcInstant'}
        firstValidTime: {$ref: '#/components/schemas/UtcInstant'}
        lastValidTime: {$ref: '#/components/schemas/UtcInstant'}
        frameCount: {type: integer, minimum: 1}
    ScientificAsset:
      type: object
      required: [assetId, fileName, fileSize, products, dataMode, validTime, status]
      properties:
        assetId: {type: integer, format: int64}
        fileName: {type: string}
        fileSize: {type: integer, format: int64, minimum: 0}
        products: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/ProductCode'}}
        dataMode: {$ref: '#/components/schemas/DataMode'}
        cycleTime: {oneOf: [{$ref: '#/components/schemas/UtcInstant'}, {type: 'null'}]}
        validTime: {$ref: '#/components/schemas/UtcInstant'}
