      type: object
      required: [authenticated, user, csrfToken]
      properties:
        authenticated: {type: boolean}
        user: {oneOf: [{$ref: '#/components/schemas/AuthenticatedUser'}, {type: 'null'}]}
        csrfToken: {type: string, minLength: 1}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
    RegisterRequest:
      type: object
      required: [email, password, organization]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 10, maxLength: 128, writeOnly: true}
        organization: {type: string, minLength: 2, maxLength: 255}

    DownloadRequest:
      type: object
      required: [assetId, purpose]
