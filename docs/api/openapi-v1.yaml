        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}

    AuthenticatedUser:
      type: object
      required: [userId, email, organization, role]
      properties:
        userId: {type: integer, format: int64}
