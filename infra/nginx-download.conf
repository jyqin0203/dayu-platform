# 合并到站点 server 中；将示例目录替换为与 dayu.indexing.roots.netcdf-data 相同的真实根。
# 只有 dayu.download.transfer-mode=NGINX 时启用内部转发。
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 保留后端响应的 Content-Disposition / Content-Type。
}

location ^~ /internal-netcdf/ {
    internal;
    alias /srv/dayu/netcdf/;
    # 禁止 Nginx 直接跟随数据目录内符号链接；上游以原子重命名发布文件。
    disable_symlinks on;
    sendfile on;
    default_type application/x-netcdf;
    add_header Cache-Control "private, no-store" always;
}

# 禁止沿用旧站点的静态 NC 直连；所有科学数据必须经 Java 授权。
location ^~ /netcdf/ { return 404; }
